name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  ml-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-nlp.txt
      - run: python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Unit + integration tests (in-memory PostgreSQL & document store)
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    needs: [ml-service, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r ml-service/requirements.txt
      - run: cd backend && npm ci && cd ../frontend && npm ci && npm run build && npx playwright install --with-deps chromium
      - run: |
          (cd ml-service && uvicorn app.main:app --port 8000 &) ; sleep 15
          (cd backend && node src/server.js &) ; sleep 15
          cd frontend && npm run test:e2e

  docker:
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      # Deploy: push images to Amazon ECR and roll out on EC2/ECS (aws-actions/amazon-ecr-login),
      # or let Render auto-deploy from render.yaml on every push to main.
